services:
  webapp:
    image: openiot-webapp:${WEBAPP_VERSION:?Set WEBAPP_VERSION to a distinct local image tag}
    build:
      context: .
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
    ports:
      - "${WEBAPP_PORT:-6468}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
